<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#060A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nox">
<link rel="apple-touch-icon" href="/nox/nox-180.png">
<link rel="icon" href="/nox/nox-180.png">
<title>Nox</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060A1A;--panel:rgba(15,21,48,.78);--line:rgba(120,140,220,.16);--tile:rgba(20,27,58,.85);--ink:#EDEAE2;--mute:#A7B0CC;--gold:#E5B24C;--gold-hi:#F3CB72;--track:rgba(28,36,72,.9)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(700px 400px at 80% -10%,rgba(229,178,76,.12),transparent 60%),linear-gradient(180deg,#060A1A,#0B1230 70%,#151A3E)}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;width:1.5px;height:1.5px;border-radius:50%;background:#fff;animation:tw var(--d) ease-in-out infinite;animation-delay:var(--l)}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font:800 24px 'Bricolage Grotesque',sans-serif}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;position:relative}
.live .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid currentColor;opacity:0;animation:ping 2s ease-out infinite}
@keyframes ping{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
.ok{background:rgba(18,48,31,.9);color:#7FE0A8}.ok .dot{background:#5BD69A}
.warn{background:rgba(42,36,16,.95);color:var(--gold-hi)}.warn .dot{background:var(--gold)}
.bad{background:rgba(58,20,24,.95);color:#FFA3A8}.bad .dot{background:#FF6B73}
.off{background:rgba(28,36,72,.95);color:var(--mute)}.off .dot{background:#4A5584}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 16px}
.ring{position:relative;width:236px;height:236px}
.ring svg.r{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .prog{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.3,1);filter:drop-shadow(0 0 8px rgba(229,178,76,.55))}
.orbit{position:absolute;inset:-8px;border-radius:50%;border:1px dashed rgba(229,178,76,.25);animation:spin 30s linear infinite}
.orbit::before{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.idle .orbit{animation-duration:90s;opacity:.4}
@keyframes spin{to{transform:rotate(360deg)}}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.owl{width:80px;height:80px;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5))}
@keyframes bob{50%{transform:translateY(-5px)}}
.owl .eye{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.busy .owl .eye{filter:drop-shadow(0 0 6px #FFE7A3)}
.pct{font:800 34px 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums}
.big{font:800 22px 'Bricolage Grotesque',sans-serif;text-align:center}
.sub{font-size:13px;color:var(--mute);text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{padding:12px 14px;border-radius:16px;background:var(--tile)}
.tile .l{font-size:12px;color:var(--mute)}.tile .v{font:800 20px 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{display:flex;flex-direction:column;gap:4px}
.chart svg{width:100%;height:52px;display:block}
h2{margin:0 0 10px;font:700 17px 'Bricolage Grotesque',sans-serif}
.log{padding:12px;border-radius:14px;background:rgba(5,8,20,.8);font:12px/1.55 ui-monospace,Menlo,monospace;color:#B9C3E6;white-space:pre-wrap;word-break:break-all}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
a.btn{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:14px;background:var(--tile);border:1px solid rgba(120,140,220,.28);color:var(--ink);text-decoration:none;font-weight:700}
.note{padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.updated{font-size:12px;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<main>
  <header>
    <div class="brand"><svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><path d="M14 19 L19 7 L27 15 Q32 13 37 15 L45 7 L50 19 Q57 30 52 43 Q46 57 32 57 Q18 57 12 43 Q7 30 14 19Z" fill="#251c4d" stroke="#f3c55a" stroke-width="3"/><circle cx="24" cy="31" r="7" fill="#ffe7a3"/><circle cx="40" cy="31" r="7" fill="#ffe7a3"/><circle cx="25" cy="30" r="2.4" fill="#0d0a1d"/><circle cx="41" cy="30" r="2.4" fill="#0d0a1d"/><path d="M30 39 L32 44 L34 39Z" fill="#f3c55a"/></svg><b>Nox</b></div>
    <span class="pill off" id="pc"><span class="dot"></span>Connecting…</span>
  </header>
  <div id="app"></div>
  <div class="updated" id="updated"></div>
</main>
<script>
const SB = 'https://ynwabowujlalbztriqwj.supabase.co', ANON = 'sb_publishable_PfxVeJHIKIzqtj_X3i9LjQ_rMWts8Dm';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = (location.hash.match(/k=([A-Za-z0-9_-]{16,})/) || [])[1] || '';
const OWL = '<svg class="owl" viewBox="0 0 64 64" aria-hidden="true"><path d="M14 19 L19 7 L27 15 Q32 13 37 15 L45 7 L50 19 Q57 30 52 43 Q46 57 32 57 Q18 57 12 43 Q7 30 14 19Z" fill="#251c4d" stroke="#f3c55a" stroke-width="3"/><circle class="eye" cx="24" cy="31" r="7" fill="#ffe7a3"/><circle class="eye" cx="40" cy="31" r="7" fill="#ffe7a3"/><circle cx="25" cy="30" r="2.4" fill="#0d0a1d"/><circle cx="41" cy="30" r="2.4" fill="#0d0a1d"/><path d="M30 39 L32 44 L34 39Z" fill="#f3c55a"/></svg>';
(function(){ let h = ''; for (let i = 0; i < 90; i++) h += `<i class="star" style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.pow(Math.random(),1.5)*90).toFixed(1)}%;--d:${(3+Math.random()*5).toFixed(1)}s;--l:-${(Math.random()*8).toFixed(1)}s"></i>`; $('stars').innerHTML = h; })();
const pill = (cls, text, live) => { const p = $('pc'); p.className = 'pill ' + cls + (live ? ' live' : ''); p.innerHTML = '<span class="dot"></span>' + esc(text); };
const ago = s => s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago';
function spark(arr, max, color, id){
  if (!arr || arr.length < 2) return '<svg viewBox="0 0 100 40" preserveAspectRatio="none"></svg>';
  const pts = arr.map((v, i) => (i / (arr.length - 1) * 100).toFixed(1) + ',' + (38 - Math.min(1, v / max) * 34).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="0,40 ${pts} 100,40" fill="url(#${id})"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
let built = false, lastSent = 0;
function render(d, age){
  const n = d.nox || {}, g = d.gpu, st = n.state || 'Idle';
  const busy = st === 'Training' || /^Running/.test(st), stale = age > 150;
  const cls = st === 'Failed' ? 'bad' : (st === 'Idle' || st === 'Stopped') ? 'off' : st === 'Done' ? 'ok' : 'warn';
  if (stale) pill('bad', 'PC offline'); else pill('ok', 'PC online', true);
  const size = 236, stroke = 14, r = size / 2 - stroke, c = 2 * Math.PI * r, pct = n.pct != null ? n.pct : 0;
  if (!built){
    built = true;
    $('app').innerHTML = `<section class="panel hero"><div class="ring" id="ring"><div class="orbit"></div><svg class="r" viewBox="0 0 ${size} ${size}"><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3CB72"/><stop offset="1" stop-color="#C98F2A"/></linearGradient></defs><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(28,36,72,.9)" stroke-width="${stroke}"/><circle class="prog" id="prog" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-width="${stroke}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}"/></svg><div class="mid">${OWL}<span class="pct" id="pct">–</span></div></div>
      <span class="pill" id="state"></span><div class="big" id="what"></div><div class="sub" id="eta"></div></section>
      <section class="grid" id="tiles"></section>
      <section class="panel"><h2>GPU</h2><div class="grid" id="charts"></div></section>
      <section class="panel"><h2>Latest log</h2><div class="log" id="log"></div></section>
      <section class="panel" id="runBox"><h2>Last GitHub run</h2><div class="row"><span id="run"></span></div><div style="margin-top:12px"><a class="btn" id="runLink" href="https://github.com/moonshiftstudio/commander-table/actions" target="_blank" rel="noopener">Open on GitHub</a></div></section>`;
  }
  $('ring').className = 'ring ' + (busy && !stale ? 'busy' : 'idle');
  requestAnimationFrame(() => $('prog').style.strokeDashoffset = (c * (1 - Math.min(100, pct) / 100)).toFixed(1));
  $('pct').textContent = n.pct != null ? Math.round(n.pct) + '%' : '–';
  const s = $('state'); s.className = 'pill ' + cls + (busy ? ' live' : ''); s.innerHTML = '<span class="dot"></span>' + esc(stale && busy ? 'Last seen training' : st);
  $('what').textContent = n.label ? (n.label.charAt(0).toUpperCase() + n.label.slice(1)) : 'No training yet';
  $('eta').textContent = st === 'Stopped' ? (n.epoch ? 'Stopped at epoch ' + n.epoch : 'Stopped') : [n.epoch && 'Epoch ' + n.epoch, busy && n.eta && 'about ' + n.eta + ' left', !busy && n.updated && 'finished ' + n.updated].filter(Boolean).join(' · ');
  const t = [];
  if (n.speed) t.push(['Speed', n.speed]); if (n.loss) t.push(['Loss', n.loss]);
  t.push(['Runner', n.runner || '–']); if (d.disk) t.push([d.disk.drive + ' free', d.disk.free_tb.toFixed(2) + ' TB']);
  $('tiles').innerHTML = t.map(x => `<div class="tile"><div class="l">${esc(x[0])}</div><div class="v">${esc(x[1])}</div></div>`).join('');
  const h = d.hist || [];
  $('charts').innerHTML = g ? [['Use', Math.round(g.util) + '%', spark(h.map(x => x[1]), 100, '#E5B24C', 'c1')], ['Temp', Math.round(g.temp) + '°C', spark(h.map(x => x[2]), 95, '#FF8A5C', 'c2')], ['VRAM', g.mem_used.toFixed(1) + ' GB', spark(h.map(x => x[3]), g.mem_total || 16, '#8FA8FF', 'c3')], ['Power', Math.round(g.power || 0) + ' W', '']]
    .map(x => `<div class="tile chart"><div class="l">${x[0]}</div><div class="v">${x[1]}</div>${x[2]}</div>`).join('') : '<div class="sub">No GPU reading.</div>';
  $('log').textContent = (n.tail && n.tail.length) ? n.tail.join('\n') : (n.note || 'No log yet.');
  const run = d.run;
  $('runBox').style.display = run ? '' : 'none';
  if (run){ const word = {in_progress: 'Running', queued: 'Queued', waiting: 'Waiting', success: 'Finished', failure: 'Failed', cancelled: 'Cancelled'}; const k = run.status === 'completed' ? (run.result || 'success') : run.status; $('run').textContent = (word[k] || k) + ' · started ' + run.ago; if (run.url && /^https:\/\/github\.com\//.test(run.url)) $('runLink').href = run.url; }
  $('updated').textContent = stale ? `Your PC last checked in ${ago(age)}. Is it on, with Moonshift HQ running?` : `Updated ${ago(age)} · ${d.time || ''}`;
}
async function poll(){
  if (!KEY){ $('app').innerHTML = '<section class="panel note"><div class="big">Open Nox from your PC</div><div class="sub">In Moonshift HQ on your PC, go to the Nox tab and press <b>Phone</b>. Scan the code with your camera.</div></section>'; pill('off', 'Not linked'); return; }
  try {
    const r = await fetch(SB + '/rest/v1/rpc/hq_read', {method: 'POST', headers: {apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json'}, body: JSON.stringify({p_key: KEY}), cache: 'no-store'});
    const j = await r.json();
    if (j === null){ built = false; $('app').innerHTML = '<section class="panel note"><div class="big">This link was replaced</div><div class="sub">Get the new code from Moonshift HQ on your PC (Nox tab → Phone).</div></section>'; pill('bad', 'Old link'); return; }
    if (j.empty){ built = false; $('app').innerHTML = '<section class="panel note">' + OWL + '<div class="big">Waiting for your PC</div><div class="sub">It shows up here within a minute of Moonshift HQ running.</div></section>'; pill('off', 'Waiting'); return; }
    const age = Math.max(0, (Date.parse(j.now) - Date.parse(j.updated_at)) / 1000);
    render(j.data, age);
  } catch(e){ pill('bad', 'No connection'); }
}
poll(); setInterval(poll, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
